name: storage_shrink
description: Smart storage optimizer with AI screenshot classification
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # Permissions
  permission_handler: ^11.3.1
  device_info_plus: ^10.1.0

  # Storage & File Access
  path_provider: ^2.1.3
  path: ^1.9.0
  photo_manager: ^3.3.0
  disk_space_plus: ^4.0.1

  # Compression
  archive: ^3.5.1
  flutter_image_compress: ^2.2.0

  # AI / ML
  google_mlkit_text_recognition: ^0.13.0
  google_mlkit_image_labeling: ^0.12.0
  google_mlkit_barcode_scanning: ^0.12.0

  # UI & Animation
  lottie: ^3.1.2
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  percent_indicator: ^4.2.3
  fl_chart: ^0.68.0

  # Notifications & Background
  flutter_local_notifications: ^17.2.1+2
  workmanager: ^0.5.2
  timezone: ^0.9.4

  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.3
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/mascot/
    - assets/lottie/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
